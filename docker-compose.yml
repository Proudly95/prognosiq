services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: prognosiq
      POSTGRES_PASSWORD: prognosiq
      POSTGRES_DB: prognosiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prognosiq"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
