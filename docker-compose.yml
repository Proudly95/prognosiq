services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: prognosiq
      POSTGRES_PASSWORD: prognosiq
      POSTGRES_DB: prognosiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prognosiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  simulator:
    build: ./services/simulator
    restart: unless-stopped
    ports:
      - "4841:4840"
    volumes:
      - ./services/simulator/config.toml:/app/config.toml:ro

volumes:
  pgdata:
