name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: prognosiq
          POSTGRES_PASSWORD: prognosiq
          POSTGRES_DB: prognosiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U prognosiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://prognosiq:prognosiq@localhost:5432/prognosiq
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: DEBUG 5432 (temporary — delete after diagnosis)
        run: |
          echo "=== listeners on 5432 ==="
          sudo ss -ltnp | grep 5432 || echo "(none)"
          echo "=== containers ==="
          docker ps --format '{{.Names}} {{.Ports}} {{.Status}}'
          CID=$(docker ps -q --filter name=postgres | head -1)
          echo "=== container logs (last 15) ==="
          docker logs "$CID" | tail -15
          echo "=== auth via TCP *inside* the container ==="
          docker exec "$CID" psql -h 127.0.0.1 -U prognosiq -d prognosiq -c "select 1 as inside_tcp_ok" || echo "INSIDE-TCP FAILED"
          echo "=== auth from the runner VM ==="
          uv run python - <<'EOF'
          import psycopg
          try:
              with psycopg.connect("host=127.0.0.1 port=5432 user=prognosiq password=prognosiq dbname=prognosiq", connect_timeout=5) as c:
                  print("HOST-SIDE OK:", c.execute("select current_setting('server_version')").fetchone()[0])
          except Exception as e:
              print("HOST-SIDE FAILED:", type(e).__name__, e)
          EOF
      - run: uv run pytest -v
