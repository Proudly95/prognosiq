[project]
name = "simulator"
version = "0.1.0"
description = "Simulated industrial fleet speaking OPC-UA"
requires-python = ">=3.12"
dependencies = ["asyncua>=1.0"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
